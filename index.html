<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light">
<title>풀엇사 — 전자 시집</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath stroke='%23a1a1a6' d='M11 25 19 8l8 17'/%3E%3Cpath stroke='%231d1d1f' d='M5 25 13 8l8 17'/%3E%3C/g%3E%3C/svg%3E">
<style>
@font-face {
    font-family: 'Ridibatang';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}

:root {
  --bg: #f5f5f7;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --ink-3: #a1a1a6;
  --line: #d2d2d7;
  --grid: #c7c7cc;
  --wood-1: #dccfb8;
  --wood-2: #cbbba0;
  --wood-3: #b5a388;
  --wood-back: #e9e4dc;
  --serif: 'Ridibatang', 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', 'Batang', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --fx-fade: .2;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ───────── 로고 (세로쓰기) ───────── */
.logo { display: block; width: 100%; height: auto; overflow: visible; color: var(--ink); }
.logo path, .logo circle, .logo polyline {
  fill: none; stroke: currentColor; stroke-width: 7;
  stroke-linecap: round; stroke-linejoin: round;
}
.logo .tw { stroke: var(--ink-3); }

.intro .logo .st {
  stroke-dasharray: 1 1.02; stroke-dashoffset: 1.01; opacity: 0;
  animation: draw .7s var(--d, 0s) cubic-bezier(.6, 0, .2, 1) forwards;
}
.intro .logo .sa { animation-duration: .42s; }
.intro .logo .tw {
  opacity: 0; transform: translateX(-12px);
  animation: twin .55s calc(var(--d, 0s) + .36s) var(--ease) forwards;
}
@keyframes draw {
  0% { stroke-dashoffset: 1.01; opacity: 0; }
  12% { opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 1; }
}
@keyframes twin { to { opacity: 1; transform: none; } }

/* ───────── 로딩 ───────── */
#loader {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: grid; place-items: center;
  opacity: 0; pointer-events: none;
  transition: opacity .55s ease;
}
#loader.on { opacity: 1; pointer-events: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 원고지 한 줄: 세로 줄이 로고를 가두고, 그 세로 줄이 곧 로딩바
   (위에서 아래로 회색 → 검은색으로 칠해짐) */
.ms {
  --cw: 56px; --lw: 3px;
  position: relative; width: var(--cw);
  border-top: var(--lw) solid var(--grid); border-bottom: var(--lw) solid var(--grid);
  background: rgba(255, 255, 255, .55);
}
.ms::before, .ms::after {
  content: ''; position: absolute; top: calc(var(--lw) * -1); bottom: calc(var(--lw) * -1); width: 11px;
  border-top: var(--lw) solid var(--grid); border-bottom: var(--lw) solid var(--grid);
}
.ms::before { right: 100%; }
.ms::after { left: 100%; }
.vl { position: absolute; top: calc(var(--lw) * -1); bottom: calc(var(--lw) * -1); width: var(--lw); background: var(--grid); border-radius: 1px; z-index: 1; }
.vl:nth-child(1) { left: -11px; }
.vl:nth-child(2) { left: 0; }
.vl:nth-child(3) { right: 0; }
.vl:nth-child(4) { right: -11px; }
.vl i {
  position: absolute; inset: 0; background: var(--ink);
  transform: scaleY(0); transform-origin: center top;
  transition: transform 0ms cubic-bezier(.25, .6, .3, 1);
}
.ms-logo { padding: 12px 7px; }
#loader .ms { animation: rise .9s ease both; }
#loader:not(.intro) .ms-logo { visibility: hidden; }

/* ───────── 원형 버튼 ───────── */
.round {
  position: fixed; z-index: 30;
  top: calc(14px + env(safe-area-inset-top));
  width: 44px; height: 44px; padding: 0; border-radius: 50%;
  border: 1px solid rgba(0, 0, 0, .06);
  background: rgba(255, 255, 255, .74);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 8px 24px -10px rgba(0, 0, 0, .18);
  display: grid; place-items: center; cursor: pointer;
  transition: transform .25s var(--ease), background .2s;
}
.round:active { transform: scale(.94); }
.round svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; grid-area: 1 / 1; transition: opacity .2s, transform .3s var(--ease); }
#gear { right: calc(14px + env(safe-area-inset-right)); }
#gear .i-close { opacity: 0; transform: rotate(-45deg); }
#gear[aria-expanded="true"] .i-open { opacity: 0; transform: rotate(45deg); }
#gear[aria-expanded="true"] .i-close { opacity: 1; transform: none; }
#gear .knob { fill: #fff; }
#back { position: absolute; left: calc(14px + env(safe-area-inset-left)); z-index: 10; }

/* ───────── 메인: 책장 ───────── */
.view { min-height: 100vh; min-height: 100dvh; }
#shelf-view { padding: calc(56px + env(safe-area-inset-top)) 0 48px; display: flex; flex-direction: column; }
.masthead.ms { --cw: 46px; --lw: 2.4px; margin: 0 auto clamp(28px, 6vh, 52px); }
.masthead .ms-logo { padding: 9px 6px; }

.shelf {
  width: min(720px, calc(100% - 32px)); margin: 0 auto;
  padding: 14px 14px 0;
  border-radius: 12px 12px 0 0;
  background:
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .02) 0 2px, transparent 2px 11px),
    linear-gradient(var(--wood-1), var(--wood-2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 0 0 1px rgba(0, 0, 0, .05), 0 40px 60px -40px rgba(60, 45, 20, .35);
}
.row { position: relative; display: flex; }
.row::after {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 214px; pointer-events: none;
  box-shadow: inset 10px 0 14px -12px rgba(60, 45, 20, .2), inset -10px 0 14px -12px rgba(60, 45, 20, .2);
}
.sec { flex: 1 1 0; min-width: 0; }
.books {
  display: flex; align-items: flex-end; gap: 6px;
  height: 214px; padding: 0 clamp(12px, 3vw, 28px);
  background: linear-gradient(#ddd6ca, var(--wood-back) 46%);
  box-shadow: inset 0 16px 18px -14px rgba(60, 45, 20, .3);
}
.board {
  height: 38px; display: flex; align-items: center; padding: 0 clamp(12px, 3vw, 28px);
  background:
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .022) 0 3px, transparent 3px 14px),
    linear-gradient(var(--wood-1), var(--wood-2));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), inset 0 -1px 0 rgba(0, 0, 0, .1);
  position: relative;
}
.plate {
  margin: 0; padding: 4px 12px 4px 14px; border-radius: 4px;
  font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: .28em;
  color: #5b5244; background: rgba(255, 255, 255, .5);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .07);
}
.plinth {
  width: min(748px, calc(100% - 8px)); height: 16px; margin: 0 auto;
  border-radius: 0 0 6px 6px;
  background: linear-gradient(var(--wood-2), var(--wood-3));
  box-shadow: 0 18px 26px -16px rgba(60, 45, 20, .45);
}

.book {
  position: relative; flex: none;
  width: var(--w, 52px); height: var(--h, 188px);
  padding: 0; border: 1px solid var(--bd, transparent); cursor: pointer;
  border-radius: 3px 3px 1px 1px;
  background: linear-gradient(90deg, rgba(255, 255, 255, .1), transparent 18%, transparent 80%, rgba(0, 0, 0, .22)), var(--cover, #2c2c2e);
  color: var(--fg, #f5f5f7);
  box-shadow: 2px 0 4px -2px rgba(0, 0, 0, .35);
  transition: transform .4s var(--ease), box-shadow .4s var(--ease);
}
.book::before, .book::after {
  content: ''; position: absolute; left: 0; right: 0; height: 2px; background: var(--accent, #cdb788); opacity: .9;
}
.book::before { top: 16px; }
.book::after { bottom: 44px; }
.b-title {
  position: absolute; left: 0; right: 0; top: 34px;
  display: flex; flex-direction: column; align-items: center; gap: .22em;
  font-family: var(--serif); font-size: 15px; line-height: 1.1;
}
.b-title span { display: block; }
.b-mark { position: absolute; left: 50%; bottom: 14px; width: 22px; margin-left: -11px; fill: none; stroke: var(--accent, #cdb788); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
@media (hover: hover) {
  .book:hover { transform: translateY(-10px); box-shadow: 2px 12px 14px -8px rgba(0, 0, 0, .4); }
}
.book:focus-visible { transform: translateY(-10px); }
.book.pull { transform: translateY(-26px); box-shadow: 2px 22px 18px -12px rgba(0, 0, 0, .4); }
.bookend { flex: none; position: relative; width: 7px; height: 96px; margin-left: 2px; background: #c2c2c7; border-radius: 2px 2px 0 0; }
.bookend::after { content: ''; position: absolute; left: 0; bottom: 0; width: 40px; height: 5px; background: #c2c2c7; border-radius: 0 2px 0 0; }

/* ───────── 시 ───────── */
#poem-view { display: flex; flex-direction: column; position: relative; }
.poem {
  position: relative; z-index: 2;
  width: fit-content; max-width: 100%; margin: 0 auto;
  padding: calc(clamp(84px, 13vh, 132px) + env(safe-area-inset-top)) 24px 48px;
  font-family: var(--serif); color: #000; font-synthesis: none;
}
.poem h1 { margin: 0; font-weight: 400; font-size: clamp(30px, 6vw, 46px); letter-spacing: .06em; line-height: 1.3; }
.poem .poet { margin: 12px 0 0; text-align: right; font-size: clamp(14px, 3.4vw, 16px); letter-spacing: .3em; margin-right: -.3em; color: #000; }
.poem .body { max-width: 30em; margin-top: clamp(28px, 5vh, 48px); font-size: clamp(14px, 4.1vw, 20px); line-height: 2.15; word-break: keep-all; }
.stanza { margin: 0 0 1.7em; }
.stanza:last-child { margin-bottom: 0; }
.line { display: block; padding-left: 1em; text-indent: -1em; }

/* 누를 수 있는 명사 */
.w { position: relative; cursor: pointer; text-indent: 0; -webkit-tap-highlight-color: transparent; }
.w::before {
  content: ''; position: absolute; z-index: -1; inset: .18em -.16em; border-radius: .45em;
  background: var(--wash, rgba(0, 0, 0, .07)); opacity: 0; pointer-events: none;
}
.w::after { content: ''; position: absolute; inset: -.35em -.2em; }  /* 터치 영역 넓히기 */
.w:focus-visible { outline: none; }
.w:focus-visible::before { opacity: 1; background: rgba(0, 0, 0, .08); }
@media (hover: hover) {
  .w:hover::before { opacity: 1; background: rgba(0, 0, 0, .055); }
}
.w.lit::before { background: var(--wash, rgba(0, 0, 0, .07)); animation: wash 1.6s ease-out forwards; }
@keyframes wash { 0% { opacity: 0; transform: scale(.9); } 14% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* 이펙트 레이어: 항상 시 텍스트 뒤 */
#fx {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
  opacity: calc(1 - var(--fx-fade)); transition: opacity .3s;
}
.no-fx #fx { opacity: 0; }
.p { position: absolute; left: 0; top: 0; opacity: 0; overflow: visible; }
.p.sh { filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .2)); }

/* 바닥 그래픽: 맨 아래 칸을 가로 끝까지 채움 */
.ground {
  position: relative; z-index: 0; margin-top: auto;
  width: 100%; height: clamp(260px, 34vw, 760px);
  transition: opacity .5s;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18%);
  mask-image: linear-gradient(to bottom, transparent, #000 18%);
}
.ground svg { display: block; width: 100%; height: 100%; }
.no-ground .ground { opacity: 0; visibility: hidden; }
[data-fx] { cursor: pointer; }
.breath { transform-origin: 800px 316px; animation: breath 4.2s ease-in-out infinite; }
.cloud { animation: drift 38s ease-in-out infinite alternate; }
@keyframes breath { 50% { transform: scaleY(1.025); } }
.flutter { animation: flutter 7s ease-in-out infinite; }
.flutter path { transform-box: fill-box; transform-origin: center; animation: wing .35s ease-in-out infinite alternate; }
@keyframes flutter { 0%, 100% { transform: translate(0, 0); } 30% { transform: translate(-26px, -18px); } 60% { transform: translate(14px, -30px); } }
@keyframes wing { to { transform: scaleX(.35); } }
@keyframes drift { to { transform: translateX(60px); } }

/* ───────── 설정 ───────── */
#scrim {
  position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .16);
  opacity: 0; transition: opacity .25s;
}
#settings {
  position: fixed; z-index: 25;
  top: calc(68px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right));
  width: min(360px, calc(100% - 28px));
  padding: 20px 22px 18px; border-radius: 22px;
  background: rgba(255, 255, 255, .9);
  -webkit-backdrop-filter: blur(28px) saturate(1.5); backdrop-filter: blur(28px) saturate(1.5);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 30px 70px -20px rgba(0, 0, 0, .3);
  opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top right;
  transition: opacity .22s, transform .3s var(--ease);
  outline: none; overscroll-behavior: contain;
}
.st-open #scrim { opacity: 1; }
.st-open #settings { opacity: 1; transform: none; }
#settings h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid rgba(0, 0, 0, .07); }
.opt.col { display: block; }
.opt b { display: block; font-size: 15.5px; font-weight: 500; }
.opt small { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.opt label { display: flex; justify-content: space-between; align-items: baseline; font-size: 15.5px; font-weight: 500; }
.opt output { font-size: 13px; font-weight: 400; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.switch {
  flex: none; position: relative; width: 51px; height: 31px; padding: 0; border: 0; border-radius: 31px;
  background: var(--line); cursor: pointer; transition: background .25s;
}
.switch::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .22); transition: transform .28s var(--ease);
}
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; margin: 10px 0 0;
  background: transparent; cursor: pointer; --v: 22%;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(var(--ink), var(--ink)) 0 / var(--v) 100% no-repeat, var(--line); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--ink); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 2px 6px rgba(0, 0, 0, .25); }
input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 2px 6px rgba(0, 0, 0, .25); }
input[type="range"]:disabled { opacity: .35; cursor: default; }
.range-ends { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; color: var(--ink-3); }
.kbd-hint { display: none; margin: 4px 0 0; padding-top: 12px; border-top: 1px solid rgba(0, 0, 0, .07); font-size: 12px; color: var(--ink-2); }
kbd { font: 11px/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; padding: 3px 6px; border-radius: 5px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12), 0 1px 0 1px rgba(0, 0, 0, .06); margin-right: 4px; }
@media (hover: hover) and (pointer: fine) { .kbd-hint { display: block; } }

@media (max-width: 600px) {
  #settings {
    top: auto; right: 0; left: 0; bottom: 0; width: 100%;
    border-radius: 24px 24px 0 0; padding: 22px 22px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(24px); transform-origin: bottom center;
  }
  .shelf { padding: 10px 10px 0; }
  .book { --w: 48px; }
}


/* 비행공포증: 비, 번개, 날개 */
.rd { opacity: 0; animation: rainfall 1.5s linear infinite; }
@keyframes rainfall { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: .55; } 100% { transform: translate(-30px, 560px); opacity: 0; } }
.flash { opacity: 0; animation: flash 9s linear infinite; }
@keyframes flash { 0%, 56%, 100% { opacity: 0; } 58% { opacity: .95; } 60% { opacity: .15; } 62% { opacity: 1; } 69% { opacity: 0; } }
.blink { animation: blink 1.8s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.shake { transform-origin: 1500px 240px; animation: shake 3.6s ease-in-out infinite; }
@keyframes shake { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-3px) rotate(-.4deg); } 60% { transform: translateY(2px) rotate(.3deg); } }
.sl { opacity: 0; animation: slide 2.2s linear infinite; }
@keyframes slide { 0% { transform: translateX(-30px); opacity: 0; } 25% { opacity: .85; } 100% { transform: translateX(90px); opacity: 0; } }

/* 페르소나: 엘리베이터 */
.dl { animation: door-l 12s cubic-bezier(.6, 0, .3, 1) infinite; }
.dr { animation: door-r 12s cubic-bezier(.6, 0, .3, 1) infinite; }
@keyframes door-l { 0%, 16% { transform: translateX(0); } 30%, 68% { transform: translateX(-150px); } 82%, 100% { transform: translateX(0); } }
@keyframes door-r { 0%, 16% { transform: translateX(0); } 30%, 68% { transform: translateX(150px); } 82%, 100% { transform: translateX(0); } }
.spill { opacity: 0; animation: spill 12s ease-in-out infinite; }
@keyframes spill { 0%, 16% { opacity: 0; } 30%, 68% { opacity: .75; } 82%, 100% { opacity: 0; } }
.flr { fill: #5d5d63; animation: lit 6s linear infinite; }
@keyframes lit { 0%, 15% { fill: #ecddbb; } 20%, 100% { fill: #5d5d63; } }
.msmile { opacity: 0; animation: msmile 12s ease-in-out infinite; }
@keyframes msmile { 0%, 6% { opacity: 0; } 12%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
.walk { transform-box: fill-box; transform-origin: 50% 100%; animation: walk 2.4s ease-in-out infinite; }
@keyframes walk { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }

.hover { transform-box: fill-box; transform-origin: center; animation: hover 6s ease-in-out infinite; }
@keyframes hover { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(-.6deg); } }
.drift { transform-box: fill-box; transform-origin: center; animation: drift2 7s ease-in-out infinite; }
@keyframes drift2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

@media (prefers-reduced-motion: reduce) {
  .intro .logo .st, .intro .logo .tw, #loader .ms { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
  .hover, .drift, .breath, .cloud, .flutter, .flutter path, .shake, .sl, .blink, .dl, .dr, .spill, .flr, .walk { animation: none; }
  .rd { animation: none; opacity: .25; }
  .flash { animation: none; }
  .msmile { animation: none; opacity: 1; }
  .book, .round, #settings { transition-duration: .01s; }
}
</style>
</head>
<body>

<!-- 이펙트용 도형 (이모지 대신 SVG) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="s-mote" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/></symbol>
    <symbol id="s-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
    <symbol id="s-ray" viewBox="0 0 24 24"><rect x="10.8" y="3" width="2.4" height="18" rx="1.2" fill="currentColor"/></symbol>

/* ════════════════════════════════════════════════
   2. 도구
   ════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const R = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SVGNS = 'http://www.w3.org/2000/svg';

/* 낮은 채도의 이펙트 팔레트 */
const C = {
  gold: '#cdb788', gold2: '#bfa56e', sun: '#e0c896',
  pink: '#dbb1b4', apricot: '#e3bd9f', smoke: '#b6b6bb',
  sage: '#a9b7a4', white: '#ffffff', gray: '#a1a1a6',
  cloud: '#c9d0d8', mist: '#d5dce4', rain: '#8f9cab', blue: '#a9bccb', lav: '#b8b6cc',
  pgray: '#c9aeb8', bolt: '#e0d2a4', steel: '#b3b7bf', rose: '#d9b8b2'
};
const rgba = (hex, a) => {

};

/* ════════════════════════════════════════════════
   3. 로고 — 세로쓰기 '풀엇사'
      엇의 ㅅ(받침)과 사의 ㅅ을 같은 세로줄에 겹쳐 세우고,
      ㅅ마다 회색 그림자 ㅅ이 하나씩 더 따라옵니다.
   ════════════════════════════════════════════════ */
function logoSVG() {
  const s = 'class="st" pathLength="1"';
  return `<svg class="logo" viewBox="-2 2 104 292" role="img" aria-label="풀엇사">
  <g style="--d:0s">
    <path ${s} d="M14 8H76"/><path ${s} d="M30 8V26"/><path ${s} d="M60 8V26"/><path ${s} d="M10 26H80"/>
    <path ${s} d="M4 40H86"/><path ${s} d="M45 40V52"/>
    <path ${s} d="M18 60H72V73H18V86H74"/>
  </g>
  <g transform="translate(0 94)">
    <g style="--d:.2s"><circle ${s} cx="32" cy="28" r="18"/><path ${s} d="M80 4V54"/><path ${s} d="M62 28H80"/></g>
    <g style="--d:.8s"><polyline class="tw" points="22,94 46,64 70,94"/><polyline class="st sa" pathLength="1" points="10,94 34,64 58,94"/></g>
  </g>
  <g transform="translate(0 190)">
    <g style="--d:1.1s"><polyline class="tw" points="22,92 46,12 70,92"/><polyline class="st sa" pathLength="1" points="10,92 34,12 58,92"/></g>
    <g style="--d:.4s"><path ${s} d="M84 4V96"/><path ${s} d="M84 50H97"/></g>
  </g>
</svg>`;
}
document.querySelectorAll('.logo-slot').forEach(el => { el.innerHTML = logoSVG(); });

/* ════════════════════════════════════════════════
   4. 이펙트 엔진 — 작은 SVG 도형 입자
   ════════════════════════════════════════════════ */
const FX = (() => {
  const layer = $('#fx');
  const parts = [];
  const MAX = 150;
  let raf = 0, last = 0, amb = null, acc = 0, ambCount = 0;

  function spawn(kind, o) {
    if (parts.length >= MAX) kill(0);
    const el = document.createElementNS(SVGNS, 'svg');
    el.setAttribute('viewBox', '0 0 24 24');
    el.setAttribute('class', 'p' + (o.cls ? ' ' + o.cls : ''));
    const use = document.createElementNS(SVGNS, 'use');
    use.setAttribute('href', '#s-' + kind);
    el.appendChild(use);
    const size = o.size || 10;
    el.style.width = el.style.height = size + 'px';
    el.style.margin = (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px';
    el.style.color = o.color || C.gold;
    layer.appendChild(el);
    const p = Object.assign({
      el, x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, drag: 0,
      rot: 0, vr: 0, s: 1, ds: 0, sway: 0, swayF: 1, ph: R(0, 6.28),
      life: 0, max: 2, a: .5, fin: .12, fout: .55, delay: 0, amb: false
    }, o);
    if (p.amb) ambCount++;
    parts.push(p);
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    return p;
  }
  function kill(i) {
    const p = parts[i];
    p.el.remove();
    if (p.amb) ambCount--;
    parts.splice(i, 1);
  }
  function tick(now) {
    raf = 0;
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (amb) {
      acc += dt * amb.rate;
      while (acc >= 1) { acc--; if (ambCount < amb.max()) amb.spawn(false); }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.life += dt;
      const k = p.life / p.max;
      if (k >= 1) { kill(i); continue; }
      if (p.drag) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
      p.vx += p.ax * dt; p.vy += p.ay * dt;
      p.x += (p.vx + Math.cos(p.ph + p.life * p.swayF) * p.sway) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt; p.s += p.ds * dt;
      const fade = k < p.fin ? k / p.fin : k > p.fout ? (1 - k) / (1 - p.fout) : 1;
      p.el.style.opacity = (p.a * fade).toFixed(3);
      p.el.style.transform = `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0) rotate(${p.rot.toFixed(1)}deg) scale(${p.s.toFixed(3)})`;
    }
    if (parts.length || amb) raf = requestAnimationFrame(tick);
  }
  function ambient(cfg) {
    if (amb === cfg) return;
    amb = cfg; acc = 0;
    if (cfg) {
      for (let i = 0; i < Math.round(cfg.max() * .45); i++) cfg.spawn(true);
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    }
  }
  function clear() {
    amb = null;
    while (parts.length) kill(parts.length - 1);
  }
  return { spawn, ambient, clear };
})();

/* 명사를 눌렀을 때 피어나는 효과들 */
const B = {
  dust(x, y, colors = [C.gold, C.sun]) {
    for (let i = 0; i < 8; i++) {
      const a = R(0, 6.28), sp = R(18, 66);
      FX.spawn('mote', { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 26, ay: -12, drag: 1.3, size: R(4, 9), a: R(.4, .65), max: R(1.2, 2.1), color: pick(colors) });
    }
  },
  sparks(x, y, colors = [C.gold, C.gold2, C.sun], n = 7) {
    for (let i = 0; i < n; i++) {
      const a = R(0, 6.28), sp = R(30, 90);
      FX.spawn('spark', { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, drag: 1.8, vr: R(-120, 120), rot: R(0, 90), size: R(8, 15), a: R(.55, .8), max: R(1, 1.7), color: pick(colors) });
    }
  },
  crown(x, y) {
    FX.spawn('crown', { x, y: y - 8, vy: -46, drag: 1.5, rot: R(-9, 9), vr: R(-6, 6), size: 34, s: .6, ds: .5, a: .8, max: 2, color: C.gold2 });
    B.sparks(x, y - 10, [C.gold, C.sun], 5);
  },
  petals(x, y) {
    for (let i = 0; i < 9; i++) {
      FX.spawn('petal', { x: x + R(-34, 34), y: y + R(-16, 4), vx: R(-12, 12), vy: R(18, 42), sway: R(14, 28), swayF: R(1.5, 2.8), rot: R(0, 360), vr: R(-90, 90), size: R(10, 16), a: .95, max: R(2.4, 3.6), delay: i * .05, color: C.white, cls: 'sh' });
    }
  },
  leaves(x, y) {
    for (let i = 0; i < 5; i++) {
      FX.spawn('leaf', { x: x + R(-24, 24), y: y + R(-12, 2), vx: R(-10, 10), vy: R(20, 40), sway: R(18, 30), swayF: R(1.4, 2.4), rot: R(0, 360), vr: R(-70, 70), size: R(12, 17), a: .6, max: R(2.2, 3.2), delay: i * .07, color: pick([C.sage, C.gold]) });
    }
  },
  smoke(x, y) {
    for (let i = 0; i < 7; i++) {
      FX.spawn('mote', { x: x + R(-8, 8), y, vx: R(-6, 6), vy: R(-34, -18), sway: R(8, 18), swayF: R(1, 2), size: R(12, 18), ds: R(.5, .9), a: R(.2, .3), max: R(2.2, 3.4), delay: i * .13, color: C.smoke });
    }
  },
  halo(x, y, colors = [C.gold, C.sun, C.gold], speed = 1) {
    colors.forEach((color, i) => {
      FX.spawn('ring', { x, y, size: 30, s: .4, ds: 1.8 * speed, a: .7, max: 1.5 / speed, delay: i * .22 / speed, fin: .08, fout: .3, color });
    });
  },
  rays(x, y) {
    const n = 12;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 6.283;
      FX.spawn('ray', { x: x + Math.cos(a) * 16, y: y + Math.sin(a) * 16, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70, drag: 1.8, rot: a * 57.3 + 90, size: 17, a: .65, max: 1.2, color: i % 2 ? C.gold : C.sun });
    }
    FX.spawn('mote', { x, y, size: 26, s: .5, ds: .7, a: .3, max: 1.2, color: C.sun });
  },
  paws(x, y, color = C.pink) {

/* ════════════════════════════════════════════════
   6. 설정
   ════════════════════════════════════════════════ */
const KEY = 'pureotsa.settings.v1';
const S = { fx: !reduced, fade: 20, ground: true };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* 저장소를 쓸 수 없어도 그대로 동작 */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ } };

const app = $('#app'), gear = $('#gear'), panel = $('#settings'), scrim = $('#scrim');
const swFx = $('#sw-fx'), swGround = $('#sw-ground'), rgFade = $('#rg-fade'), outFade = $('#out-fade');
let current = null; // 지금 펼친 시

function applySettings() {
  document.documentElement.style.setProperty('--fx-fade', (S.fade / 100).toFixed(2));
  document.body.classList.toggle('no-fx', !S.fx);
  document.body.classList.toggle('no-ground', !S.ground);
  swFx.setAttribute('aria-checked', String(S.fx));
  swGround.setAttribute('aria-checked', String(S.ground));
  rgFade.value = S.fade;
  rgFade.disabled = !S.fx;
  rgFade.style.setProperty('--v', (S.fade / 90 * 100) + '%');
  outFade.textContent = S.fade + '%';
  if (current && S.fx) FX.ambient(THEMES[current.theme].ambient);
  else FX.clear();
}
swFx.addEventListener('click', () => { S.fx = !S.fx; save(); applySettings(); });
swGround.addEventListener('click', () => { S.ground = !S.ground; save(); applySettings(); });
rgFade.addEventListener('input', () => { S.fade = +rgFade.value; save(); applySettings(); });

let stOpen = false, stTimer = 0;
function setSettings(open, viaKeyboard) {
  if (open === stOpen) return;
  stOpen = open;
  clearTimeout(stTimer);
  gear.setAttribute('aria-expanded', String(open));
  gear.setAttribute('aria-label', open ? '설정 닫기' : '설정 열기');
  app.inert = open;
  if (open) {
    panel.hidden = scrim.hidden = false;
    void panel.offsetWidth;
    document.body.classList.add('st-open');
    if (viaKeyboard) swFx.focus();
  } else {
    document.body.classList.remove('st-open');
    if (panel.contains(document.activeElement)) gear.focus();
    stTimer = setTimeout(() => { panel.hidden = scrim.hidden = true; }, 300);
  }
}
gear.addEventListener('click', () => setSettings(!stOpen));
scrim.addEventListener('click', () => setSettings(false));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#loader').classList.contains('on')) return;
    e.preventDefault();
    setSettings(!stOpen, true);
  } else if (e.key === 'Tab' && stOpen) {
    const f = [gear, ...panel.querySelectorAll('button, input')].filter(el => !el.disabled);
    const i = f.indexOf(document.activeElement);
    e.preventDefault();
    f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
});

/* ════════════════════════════════════════════════
   7. 책장
   ════════════════════════════════════════════════ */
const POEMS = {};
$('#shelf').innerHTML = '<div class="row">' + SHELF.map((sec, si) => {
  const books = sec.poems.map((p, i) => {
    POEMS[p.id] = Object.assign({ poet: sec.poet }, p);
    const title = [...p.title].map(ch => `<span>${esc(ch)}</span>`).join('');
    return `<button class="book" type="button" data-id="${esc(p.id)}" style="--cover:${p.cover};--accent:${p.accent};--h:${p.h || 188}px;${p.fg ? `--fg:${p.fg};` : ''}${p.bd ? `--bd:${p.bd};` : ''}" aria-label="${esc(sec.poet)}의 시 「${esc(p.title)}」 펼치기">
      <span class="b-title">${title}</span>
      <svg class="b-mark" viewBox="0 0 28 16" aria-hidden="true"><path d="M10 14 18 2l8 12" opacity=".55"/><path d="M2 14 10 2l8 12"/></svg>
    </button>`;
  }).join('');
  return `<section class="sec" aria-labelledby="plate-${si}">
    <div class="books">${books}<span class="bookend" aria-hidden="true"></span></div>
    <div class="board"><h2 class="plate" id="plate-${si}">${esc(sec.poet)}</h2></div>
  </section>`;
}).join('') + '</div>';

$('#shelf').addEventListener('click', e => {
  const book = e.target.closest('.book');
  if (!book || busy) return;
  book.classList.add('pull');
  setTimeout(() => { location.hash = book.dataset.id; }, reduced ? 0 : 260);
});
$('#back').addEventListener('click', () => { location.hash = ''; });

/* ════════════════════════════════════════════════
   8. 시 화면
   ════════════════════════════════════════════════ */
const poemEl = $('#poem'), groundEl = $('#ground');

function renderLine(line) {
  return line.trim().split(/(\{[^}]+\})/).map(part => {
    if (part[0] !== '{') return esc(part);
    const n = esc(part.slice(1, -1));
    return `<span class="w" data-n="${n}" role="button" tabindex="0">${n}</span>`;
  }).join('');
}
function renderPoem(p) {
  const stanzas = p.text.trim().split(/\n\s*\n/).map(st =>
    `<p class="stanza">${st.split('\n').map(line => `<span class="line">${renderLine(line)}</span>`).join('')}</p>`
  ).join('');
  poemEl.className = 'poem';
  poemEl.innerHTML = `<h1>${esc(p.title)}</h1>
    <p class="poet">${esc(p.poet)}</p>
    <div class="body">${stanzas}</div>`;
  groundEl.innerHTML = THEMES[p.theme].ground || '';
}

function touch(w) {
  const th = THEMES[current.theme];
  const rule = th.nouns[w.dataset.n] || th.fallback || { fx: 'dust', wash: C.gold };
  w.style.setProperty('--wash', S.fx ? rgba(rule.wash === C.white ? '#d9d9de' : rule.wash, .5) : 'rgba(0,0,0,.07)');
  w.classList.remove('lit');
  void w.offsetWidth;
  w.classList.add('lit');
  if (!S.fx) return;
  const r = w.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  (typeof rule.fx === 'function' ? rule.fx : B[rule.fx])(x, y);
}
poemEl.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (w && current) touch(w);
});
poemEl.addEventListener('keydown', e => {
  const w = e.target.closest('.w');
  if (w && current && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); touch(w); }
});
poemEl.addEventListener('animationend', e => { if (e.animationName === 'wash') e.target.classList.remove('lit'); });

groundEl.addEventListener('click', e => {
  if (!S.fx) return;
  const t = e.target.closest('[data-fx]');
  if (t && B[t.dataset.fx]) B[t.dataset.fx](e.clientX, e.clientY);
});

/* ════════════════════════════════════════════════
   9. 로딩과 화면 전환
   ════════════════════════════════════════════════ */
const loaderEl = $('#loader'), barEls = loaderEl.querySelectorAll('.vl i');
const loader = {
  set(v, ms) {
    barEls.forEach(el => { el.style.transitionDuration = ms + 'ms'; });
    void loaderEl.offsetWidth;
    barEls.forEach(el => { el.style.transform = `scaleY(${v})`; });
  },
  async show() { loader.set(0, 0); loaderEl.hidden = false; void loaderEl.offsetWidth; loaderEl.classList.add('on'); await wait(reduced ? 60 : 600); },
  async hide() { loaderEl.classList.remove('on'); await wait(reduced ? 60 : 560); loaderEl.classList.remove('intro'); loaderEl.hidden = true; }
};
const fontsReady = () => (document.fonts && document.fonts.load
  ? Promise.race([document.fonts.load("1em 'Ridibatang'", '실세').catch(() => {}), wait(2600)])
  : Promise.resolve());

const routeId = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } };
let busy = false, shown;

function swap(p) {
  FX.clear();
  current = p || null;
  $('#shelf-view').hidden = !!p;
  $('#poem-view').hidden = !p;
  document.querySelectorAll('.book.pull').forEach(b => b.classList.remove('pull'));
  if (p) renderPoem(p);
  document.title = p ? `${p.title} · ${p.poet} — 풀엇사` : '풀엇사 — 전자 시집';
  scrollTo(0, 0);
  applySettings();
}

async function navigate(first) {
  if (busy) return;
  busy = true;
  const id = routeId();
  const p = POEMS[id];
  shown = p ? id : '';
  if (first) {
    swap(p);
    loader.set(.82, reduced ? 300 : 2100);
    await Promise.all([wait(reduced ? 500 : 2700), fontsReady()]);
  } else {
    setSettings(false);
    await loader.show();           // 진입 후에는 원고지 로딩바만
    swap(p);
    loader.set(.85, 520);
    await Promise.all([wait(reduced ? 150 : 640), fontsReady()]);
  }
  loader.set(1, 240);
  await wait(reduced ? 60 : 320);
  await loader.hide();
  busy = false;
  const now = POEMS[routeId()] ? routeId() : '';
  if (now !== shown) navigate(false);
}
addEventListener('hashchange', () => navigate(false));

applySettings();
navigate(true);
})();
</script>
</body>
